<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidirectional Data Ingestion Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        h3 {
            color: #4CAF50;
        }
        .section {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }
        label {
            display: inline-block;
            width: 150px;
            vertical-align: top;
            font-weight: bold;
        }
        input, select, textarea, button {
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="text"], input[type="number"], select {
            width: calc(100% - 160px);
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Bidirectional Data Ingestion Tool</h1>

    <div class="section">
        <h3>Data Source Selection</h3>
        <label for="dataSource">Select Data Source:</label>
        <select id="dataSource" onchange="toggleSourceFields()">
            <option value="clickhouse">ClickHouse</option>
            <option value="flatfile">Flat File</option>
        </select>
    </div>

    <div id="clickhouseFields" class="section">
        <h3>ClickHouse Connection</h3>
        <label for="host">Host:</label>
        <input type="text" id="host" name="host"><br>
        <label for="port">Port:</label>
        <input type="number" id="port" name="port"><br>
        <label for="database">Database:</label>
        <input type="text" id="database" name="database"><br>
        <label for="jwtToken">JWT Token:</label>
        <input type="text" id="jwtToken" name="jwtToken"><br>
        <button onclick="connectClickHouse()">Connect</button>
        <div id="clickhouse-status" class="status"></div>
    </div>

    <div id="flatfileFields" class="section" style="display: none;">
        <h3>Flat File Configuration</h3>
        <label for="flatfile">Select Flat File (CSV):</label>
    <input type="file" id="flatfile" accept=".csv"><br><br>
        <label for="delimiter">Delimiter:</label>
        <input type="text" id="delimiter" name="delimiter" value=","><br>
        <label for="tableName">Table Name:</label>
		<input type="text" id="tableName2" name="tableName"><br>
        
        <button onclick="ingestToClickHouse()">Connect</button>
        <div id="flatfile-status" class="status"></div>
    </div>

    <div id="tableColumnSelection" class="section">
        <h3>Table/Column Selection</h3>
        <label for="tableName">Select Table:</label>
        <select id="tableName"></select>
        <button onclick="loadColumns()">Load Columns</button>
        <div id="columns"></div>
    </div>

    <div class="section">
        <h3>Ingestion Options</h3>
        <button onclick="ingestToClickHouse()">Ingestion from Flatfile to ClickHouse</button>
        <button onclick="ConnectHouseToFlatFile()">ClickHouse To FlatFile Ingestion</button>
       
        <div id="ingestion-status" class="status"></div>
    </div>

    <script>
        function toggleSourceFields() {
            var dataSource = document.getElementById("dataSource").value;
            var clickhouseFields = document.getElementById("clickhouseFields");
            var flatfileFields = document.getElementById("flatfileFields");
            var tableColumnSelection = document.getElementById("tableColumnSelection");

            if (dataSource === "clickhouse") {
                clickhouseFields.style.display = "block";
                flatfileFields.style.display = "none";
                tableColumnSelection.style.display = "block";

            } else {
                clickhouseFields.style.display = "none";
                flatfileFields.style.display = "block";
                tableColumnSelection.style.display = "none"; // Hide table selection section for FlatFile

            }
        }

        function connectClickHouse() {
            // Build connection config from the form
            const config = {
                host: document.getElementById("host").value,
                port: parseInt(document.getElementById("port").value),
                database: document.getElementById("database").value,
                jwtToken: document.getElementById("jwtToken").value
            };
            fetch('/api/connect-clickhouse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
            .then(response => {
                console.log("Response status:", response.status);
                return response.json();
            })
            .then(data => {
            	if(Array.isArray(data)){
                const tableNameSelect = document.getElementById('tableName');
                tableNameSelect.innerHTML = '';
                data.forEach(table => {
                    const option = document.createElement('option');
                    option.text = table;
                    tableNameSelect.appendChild(option);
                });
                document.getElementById('clickhouse-status').innerText = 'Connected successfully.';
            }})
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('clickhouse-status').innerText = 'Connection error.';
            });
        }


        function connectFlatFile() {
            // Implement Flat File connection logic here
            document.getElementById('flatfile-status').innerText = 'Flat File Connected';
        }

        function loadColumns() {
            const tableName = document.getElementById('tableName').value;

            fetch('/api/get-columns', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tableName: tableName })  // 👈 send as object
            })
            .then(response => response.json())
            .then(columns => {
                const columnsDiv = document.getElementById('columns');
                columnsDiv.innerHTML = '';
                columns.forEach(column => {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'column';
                    checkbox.value = column;

                    const label = document.createElement('label');
                    label.htmlFor = column;
                    label.innerText = column;

                    columnsDiv.appendChild(checkbox);
                    columnsDiv.appendChild(label);
                    columnsDiv.appendChild(document.createElement('br'));
                });
            })
            .catch(error => console.error('Error:', error));
        }


        
        function ingestToClickHouse() {
            const fileInput = document.getElementById('flatfile');
            const delimiter = document.getElementById('delimiter').value || ',';  // Default delimiter is comma
            const tableName = document.getElementById('tableName').value.trim();

            if (!fileInput.files.length && !tableName) {
                alert("Please select a CSV file and specify the table name.");
                return;
            }

            const source = 'flatfile';  // Assuming flatfile ingestion
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const contents = e.target.result;
                const rows = contents.split('\n').map(row => row.split(delimiter).map(cell => cell.trim()));

                const headers = rows[0];  // First row is header
                const data = rows.slice(1).filter(row => row.length === headers.length); // Ensure the data rows match headers length

                // Prepare the request data
                const ingestionData = {
                    source: source,
                    tableName: tableName,
                    columns: headers,
                    delimiter: delimiter,
                    data: data
                };

                // Send to backend
                fetch('/api/ingest-to-clickhouse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(ingestionData)
                })
                .then(response => response.text())
                .then(message => {
                    document.getElementById('ingestion-status').innerText = message;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('ingestion-status').innerText = "An error occurred during ingestion.";
                });
            };

            reader.readAsText(file);
        }
        

        function ConnectHouseToFlatFile() {
        	const tableName = document.getElementById('tableName').value;
            const checkboxes = document.querySelectorAll('input[name="column"]:checked');
            const selectedColumns = Array.from(checkboxes).map(cb => cb.value);

            fetch('http://localhost:8080/api/export-to-csv', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableName, selectedColumns })
            })
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = tableName + '.csv';
                a.click();
                window.URL.revokeObjectURL(url);

                // Show record count (assuming 1000 is max)
                document.getElementById('record-count').innerText = "Successfully downloaded up to 1000 records.";
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to export CSV.");
            });
        }
     function importFileToTable() {
            const tableName = document.getElementById('tableName').value;
            const columns = Array.from(document.querySelectorAll('input[name="column"]:checked')).map(checkbox => checkbox.value);
            const filePath = document.getElementById('filePath').value;

            fetch('/api/import-file-to-table', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    tableName: tableName,
                    columns: columns,
                    filePath: filePath
                })
            })
            .then(response => response.text())
            .then(message => {
                document.getElementById('ingestion-status').innerText = message;
            })
            .catch(error => console.error('Error:', error));
        }

        function ingestFromFile() {
            // Implement Ingest from File logic here
            document.getElementById('ingestion-status').innerText = 'Ingesting from File';
        }
    </script>
</body>
</html>
